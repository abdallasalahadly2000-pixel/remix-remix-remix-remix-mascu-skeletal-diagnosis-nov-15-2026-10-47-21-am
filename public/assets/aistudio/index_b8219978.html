<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mascu-Skeletal Diagnosis</title>
    <meta
      name="description"
      content="Orbital musculoskeletal health and bone-density diagnostic interface."
    />
    <meta property="og:title" content="Mascu-Skeletal Diagnosis" />
    <meta
      property="og:description"
      content="Orbital musculoskeletal health and bone-density diagnostic interface."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-obsidian: #07090e;
        --bg-panel: rgba(11, 14, 23, 0.82);
        --bg-panel-solid: #0b0e17;
        --bg-input: rgba(7, 9, 14, 0.92);
        --border-hairline: rgba(255, 255, 255, 0.12);
        --border-red: rgba(239, 68, 68, 0.58);
        --border-cyan: rgba(6, 182, 212, 0.58);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --accent-red: #ef4444;
        --accent-red-soft: #f87171;
        --accent-cyan: #22d3ee;
        --font-display: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
        --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg-obsidian);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      /* Stationary Space Backdrop */
      .space-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        overflow: hidden;
        background: radial-gradient(ellipse at bottom, #0f294a 0%, #07090e 62%);
      }

      .space-backdrop img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      .space-scrim-left {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(7, 9, 14, 0.72) 0%,
          rgba(7, 9, 14, 0.18) 48%,
          transparent 100%
        );
      }

      .space-scrim-page {
        position: absolute;
        inset: 0;
        background: rgba(7, 9, 14, 0.76);
        backdrop-filter: blur(4px);
        opacity: 0;
        transition: opacity 250ms ease;
      }

      .space-scrim-page.is-active {
        opacity: 1;
      }

      /* App Stage */
      .app-stage {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        width: 100%;
      }

      .view {
        position: relative;
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 32px 24px;
        animation: viewFadeIn 260ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .view[hidden] {
        display: none !important;
      }

      @media (min-width: 640px) {
        .view {
          padding: 40px 48px;
        }
      }

      @media (min-width: 1024px) {
        .view {
          padding: 48px 64px;
        }
      }

      /* Floating Astronaut (Only astronaut moves; background stays completely still) */
      .astronaut-anchor {
        position: absolute;
        top: 4%;
        right: 2%;
        width: 210px;
        opacity: 0.88;
        pointer-events: none;
        user-select: none;
        z-index: 1;
      }

      @media (min-width: 640px) {
        .astronaut-anchor {
          top: 5%;
          right: 6%;
          width: 285px;
          opacity: 1;
        }
      }

      @media (min-width: 768px) {
        .astronaut-anchor {
          right: 8%;
          width: 335px;
        }
      }

      @media (min-width: 1024px) {
        .astronaut-anchor {
          top: 4%;
          right: 9%;
          width: 385px;
        }
      }

      .astronaut-float {
        will-change: transform;
        animation: astronautDrift 7.5s ease-in-out infinite;
      }

      .astronaut-float img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 0 22px rgba(239, 68, 68, 0.2));
      }

      @keyframes astronautDrift {
        0%,
        100% {
          transform: translateY(0px) rotate(-0.6deg);
        }
        50% {
          transform: translateY(-14px) rotate(0.7deg);
        }
      }

      @keyframes viewFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes navSlideIn {
        from {
          opacity: 0;
          transform: translateX(-18px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.97) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .astronaut-float,
        .view,
        .mission-btn,
        .pop-animate {
          animation: none !important;
          transition: none !important;
        }
      }

      /* Orbit Header & Giant White Welcome */
      .orbit-header {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        max-width: 48rem;
      }

      .brand-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.025em;
        color: #e2e8f0;
      }

      @media (min-width: 640px) {
        .brand-title {
          font-size: 1.25rem;
        }
      }

      @media (min-width: 1024px) {
        .brand-title {
          font-size: 1.5rem;
        }
      }

      .welcome-wrap {
        margin: auto 0;
        padding: 32px 0;
      }

      .welcome-heading {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(4.25rem, 11vw, 11rem);
        line-height: 0.94;
        letter-spacing: -0.025em;
        color: #ffffff;
        text-wrap: balance;
      }

      /* Bottom-Left 6 Mission Navigation Buttons */
      .orbit-nav {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 9px;
        width: 100%;
        max-width: 384px;
        padding-top: 10px;
      }

      .mission-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid var(--border-hairline);
        background: rgba(11, 14, 23, 0.78);
        backdrop-filter: blur(12px);
        color: #f1f5f9;
        cursor: pointer;
        text-align: left;
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
        animation: navSlideIn 320ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }

      .mission-btn:nth-child(1) { animation-delay: 50ms; }
      .mission-btn:nth-child(2) { animation-delay: 95ms; }
      .mission-btn:nth-child(3) { animation-delay: 140ms; }
      .mission-btn:nth-child(4) { animation-delay: 185ms; }
      .mission-btn:nth-child(5) { animation-delay: 230ms; }
      .mission-btn:nth-child(6) { animation-delay: 275ms; }

      .mission-btn:hover {
        transform: translateX(6px);
        border-color: var(--border-red);
        background: rgba(17, 23, 38, 0.92);
        box-shadow: 0 0 24px rgba(239, 68, 68, 0.18);
      }

      .mission-btn:focus-visible,
      .btn-primary:focus-visible,
      .btn-secondary:focus-visible,
      .role-card:focus-visible,
      .top-link:focus-visible,
      .tab-btn:focus-visible {
        outline: 2px solid var(--accent-red);
        outline-offset: 2px;
      }

      .mission-btn-left {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .mission-index {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--accent-red);
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }

      .mission-label {
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @media (min-width: 640px) {
        .mission-label {
          font-size: 1rem;
        }
      }

      .mission-arrow {
        width: 16px;
        height: 16px;
        color: var(--text-muted);
        flex-shrink: 0;
        transition: transform 180ms ease, color 180ms ease;
      }

      .mission-btn:hover .mission-arrow {
        transform: translateX(4px);
        color: var(--accent-red-soft);
      }

      /* Minimal Inner Page Top Title (only Mascu-Skeletal Diagnosis, matching Orbit header) */
      .page-topbar {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .top-brand-btn {
        background: none;
        border: none;
        padding: 0;
        color: #e2e8f0;
        font-family: var(--font-display);
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.025em;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 180ms ease;
      }

      @media (min-width: 640px) {
        .top-brand-btn {
          font-size: 1.25rem;
        }
      }

      @media (min-width: 1024px) {
        .top-brand-btn {
          font-size: 1.5rem;
        }
      }

      .top-brand-btn:hover {
        color: var(--accent-red-soft);
      }

      .top-links {
        display: none;
        align-items: center;
        gap: 24px;
      }

      @media (min-width: 768px) {
        .top-links {
          display: flex;
        }
      }

      .top-link {
        background: none;
        border: none;
        padding: 4px 0;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-muted);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 180ms ease;
      }

      .top-link:hover {
        color: #f8fafc;
      }

      .top-link.is-active {
        color: var(--accent-red-soft);
        text-decoration: underline;
        text-decoration-color: rgba(239, 68, 68, 0.7);
        text-underline-offset: 8px;
      }

      /* Shared Buttons & Cards */
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid var(--border-hairline);
        background: rgba(11, 14, 23, 0.82);
        color: #f1f5f9;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: border-color 180ms ease, background-color 180ms ease, color 180ms ease;
      }

      .btn-secondary:hover {
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 46px;
        padding: 11px 22px;
        border-radius: 11px;
        border: 1px solid rgba(239, 68, 68, 0.55);
        background: rgba(239, 68, 68, 0.16);
        color: #ffffff;
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 180ms ease, border-color 180ms ease;
      }

      .btn-primary:hover {
        background: rgba(239, 68, 68, 0.28);
        border-color: rgba(239, 68, 68, 0.8);
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: color 180ms ease;
      }

      .btn-ghost:hover {
        color: #ffffff;
      }

      .page-center {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 672px;
        margin: auto;
        padding: 36px 0;
      }

      .page-center.is-wide {
        max-width: 960px;
      }

      .page-center.is-contact {
        max-width: 540px;
        margin: auto 0;
      }

      .page-center.is-skeleton {
        max-width: 1380px;
        padding: 20px 0 28px;
      }

      .contact-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(7, 9, 14, 0.78);
      }

      .contact-link {
        display: inline-block;
        margin-top: 4px;
        color: #f8fafc;
        font-family: var(--font-mono);
        font-size: 0.96rem;
        font-weight: 500;
        text-decoration: none;
        word-break: break-word;
      }

      .contact-link:hover {
        color: var(--accent-cyan);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      #contact-astronaut-img {
        filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.22));
      }

      .glass-panel {
        width: 100%;
        border-radius: 16px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-panel);
        backdrop-filter: blur(14px);
        padding: 28px;
      }

      @media (min-width: 640px) {
        .glass-panel {
          padding: 40px;
        }
      }

      .pop-animate {
        animation: popIn 220ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .panel-index {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--accent-red);
        font-variant-numeric: tabular-nums;
      }

      .panel-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.875rem;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #ffffff;
        text-wrap: balance;
      }

      .panel-header-row + .panel-title {
        margin-top: 12px;
      }

      @media (min-width: 640px) {
        .panel-title {
          font-size: 2.25rem;
        }
      }

      .panel-subtitle {
        margin: 10px 0 0;
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--text-secondary);
      }

      .panel-divider {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Role Selection Cards (Astronaut vs Doctor) */
      .role-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .role-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .role-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 156px;
        padding: 24px;
        border-radius: 12px;
        border: 1px solid var(--border-hairline);
        background: rgba(7, 9, 14, 0.86);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .role-card.role-astronaut:hover {
        border-color: var(--border-red);
        background: #111726;
        box-shadow: 0 0 24px rgba(239, 68, 68, 0.16);
      }

      .role-card.role-doctor:hover {
        border-color: var(--border-cyan);
        background: #111726;
        box-shadow: 0 0 24px rgba(6, 182, 212, 0.16);
      }

      .role-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .role-card h2 {
        margin: 22px 0 6px;
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 600;
        color: #ffffff;
      }

      .role-card p {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text-muted);
      }

      /* Sign-In Form & Tabs */
      .panel-header-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .tab-group {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(7, 9, 14, 0.82);
      }

      .tab-btn {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .tab-btn.is-active {
        background: rgba(239, 68, 68, 0.2);
        color: #ffffff;
      }

      .form-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-grid-2 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .form-grid-2 {
          grid-template-columns: 1fr 1fr;
        }
      }

      .field-label {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label span {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .field-input {
        min-height: 44px;
        padding: 9px 14px;
        border-radius: 8px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-input);
        color: #ffffff;
        font-size: 0.875rem;
        transition: border-color 150ms ease;
      }

      .field-input:focus {
        outline: none;
        border-color: var(--border-red);
      }

      .error-box {
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid rgba(239, 68, 68, 0.45);
        background: rgba(239, 68, 68, 0.12);
        color: #fecaca;
        font-size: 0.875rem;
      }

      .actions-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 6px;
      }

      .actions-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 6px;
      }

      .actions-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .meta-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .page-mobile-footer {
        position: relative;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      @media (min-width: 768px) {
        .page-mobile-footer {
          display: none;
        }
      }

      .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .icon-lg {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }

      .text-red { color: var(--accent-red-soft); }
      .text-cyan { color: var(--accent-cyan); }
      .w-full { width: 100%; }

      /* Coach AI-Model Split Telemetry Layout */
      .coach-split {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        align-items: start;
      }

      @media (min-width: 820px) {
        .coach-split {
          grid-template-columns: 1fr 1fr;
          gap: 32px;
        }
      }

      .coach-subpanel {
        padding: 22px;
        border-radius: 12px;
        border: 1px solid var(--border-hairline);
        background: rgba(7, 9, 14, 0.72);
      }

      .preset-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .preset-btn {
        padding: 6px 11px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: border-color 150ms ease, color 150ms ease, background-color 150ms ease;
      }

      .preset-btn:hover {
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
      }

      .field-hint {
        margin: 0;
        font-size: 0.75rem;
        line-height: 1.45;
        color: var(--text-muted);
      }

      .mono-val {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);

        color: var(--text-muted);

      .metric-number {

        font-weight: 600;

      .metric-unit {

      .status-line {

        font-family: var(--font-display);
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.01em;

      .status-osteopenia { color: #fbbf24; }
      .status-osteoporosis { color: #f87171; }

      .conf-track {
        margin-top: 10px;
        height: 4px;
        width: 100%;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);

      }

      .conf-fill {
        height: 100%;
        background: var(--accent-cyan);

      .rec-block {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .rec-text {
        margin: 8px 0 0;
        font-size: 0.9rem;
        line-height: 1.6;
        color: #f1f5f9;
      }

      .history-table-wrap {
        width: 100%;
        overflow-x: auto;
      }

      .history-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        text-align: left;
      }

      .history-table th {
        padding: 8px 10px 10px 0;
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--text-muted);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        white-space: nowrap;
      }

      .history-table td {
        padding: 10px 10px 10px 0;
        color: var(--text-secondary);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        white-space: nowrap;
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      /* 01 · My Skeleton 3D Workbench & Inspector (No backdrop-blur over WebGL) */
      .skel-shell {
        width: 100%;
        border-radius: 16px;
        border: 1px solid var(--border-hairline);
        background: rgba(8, 11, 18, 0.94);

        flex-direction: column;
        gap: 16px;

        display: flex;
        flex-wrap: wrap;

        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);

      .skel-title-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .skel-heading {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(1.65rem, 2.6vw, 2.2rem);
        font-weight: 700;
        letter-spacing: -0.02em;

      .skel-submeta {
        margin: 6px 0 0;

      .skel-actions {

        align-items: center;

      .skel-btn {

      .skel-viewport-wrap {

      .skel-canvas-mount {
        position: absolute;

        height: 100%;

      .skel-hud-card {

      .skel-hud-btns {

      .skel-dock-wrap {

        flex-direction: column;
        align-items: center;

      .skel-dock-toggle {
        pointer-events: auto;
        padding: 4px 12px;
        border-radius: 6px 6px 0 0;

      .skel-dock {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;

      .skel-dock-sep {
        width: 1px;
        height: 20px;

      .skel-chip {
        padding: 5px 10px;
        border-radius: 6px;

      .skel-chip:hover {
        color: #f8fafc;
        background: rgba(255, 255, 255, 0.06);

      .skel-chip.is-active {
        color: #67e8f9;
        border-color: rgba(34, 211, 238, 0.5);

      .skel-tooltip {

      .skel-drawer {

      .skel-drawer-tab {

        border-bottom: 2px solid transparent;

        font-size: 0.76rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .skel-drawer-tab.is-active {
        color: #22d3ee;
        border-bottom-color: #22d3ee;
        background: rgba(6, 182, 212, 0.08);
      }

      .skel-drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .skel-selected-box {
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(34, 211, 238, 0.25);
        background: rgba(6, 10, 20, 0.9);

        flex-direction: column;
        gap: 10px;
      }

      .skel-selected-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .skel-selected-name {
        margin: 0;
        font-family: var(--font-display);
        font-size: 0.98rem;
        font-weight: 600;
        color: #ffffff;
      }

      .skel-color-code {
        display: inline-flex;

        gap: 6px;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
      }

      .skel-swatch {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        display: inline-block;
        flex-shrink: 0;
      }

      .skel-slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .skel-slider-row input[type="range"] {
        flex: 1;
        accent-color: #22d3ee;
        cursor: pointer;
      }

      .skel-metrics-mini {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .skel-metric-mini p {
        margin: 0;
      }

      .skel-metric-mini .lbl {
        font-size: 0.66rem;
        color: var(--text-muted);
      }

      .skel-metric-mini .val {
        margin-top: 2px;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        color: #f8fafc;
      }

      .skel-bone-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .skel-bone-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 68px 62px;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(7, 10, 18, 0.75);
        cursor: pointer;
        transition: border-color 140ms ease, background-color 140ms ease;
      }

      .skel-bone-row:hover {
        border-color: rgba(255, 255, 255, 0.22);
      }

      .skel-bone-row.is-selected {
        border-color: rgba(34, 211, 238, 0.65);
        background: rgba(6, 182, 212, 0.09);
      }

      .skel-bone-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 0.76rem;
        color: #e2e8f0;
      }

      .skel-bone-label span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .skel-pct-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .skel-pct-input {
        width: 52px;
        height: 28px;
        padding: 2px 6px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #060911;
        color: #ffffff;
        font-family: var(--font-mono);
        font-size: 0.74rem;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .skel-pct-input:focus {
        outline: none;
        border-color: #22d3ee;
      }

      .skel-sensor-card {
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(7, 10, 18, 0.75);
        cursor: pointer;
      }

      .skel-sensor-card:hover {
        border-color: rgba(34, 211, 238, 0.35);
      }

      .skel-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(4, 7, 13, 0.84);
      }

      .skel-modal-backdrop[hidden] {
        display: none;
      }

      .skel-modal {
        width: 100%;
        max-width: 640px;
        border-radius: 14px;
        border: 1px solid rgba(34, 211, 238, 0.3);
        background: #0b101d;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .skel-textarea {
        width: 100%;
        min-height: 170px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #060911;
        color: #f8fafc;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        line-height: 1.5;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <!-- Stationary Space Background (Earth, Stars, Milky Way never move) -->
    <div aria-hidden="true" class="space-backdrop">
      <img id="orbit-backdrop-img" alt="" referrerpolicy="no-referrer" />
      <div class="space-scrim-left"></div>
      <div id="page-scrim" class="space-scrim-page"></div>
    </div>

    <div class="app-stage">
      <!-- =================================================================== -->
      <!-- MAIN ORBIT PAGE                                                     -->

    <script>
      (function () {
        // Resolve image paths automatically whether opened directly (file://) or via Vite (http/https)
        var assetBase = window.location.protocol === 'file:' ? './public/assets' : './assets';
        var backdropImg = document.getElementById('orbit-backdrop-img');
        var astronautImg = document.getElementById('astronaut-img');
        var contactAstronautAnchor = document.getElementById('contact-astronaut-anchor');
        var contactAstronautImg = document.getElementById('contact-astronaut-img');

        backdropImg.src = assetBase + '/orbit_space_backdrop.jpg';
        backdropImg.onerror = function () {
          backdropImg.style.display = 'none';
        };

        astronautImg.src = assetBase + '/floating_astronaut.png';
        astronautImg.onerror = function () {
          astronautImg.style.display = 'none';
        };

        contactAstronautImg.src = assetBase + '/astronaut_like.png';
        contactAstronautImg.onerror = function () {
          contactAstronautImg.style.display = 'none';
        };

        var vendorBase = window.location.protocol === 'file:' ? './public/vendor' : './vendor';

        var MODULES = {
          signin: { index: '00', label: 'Sign In', hash: '#sign-in' },
          skeletons: { index: '01', label: 'My Skeleton', hash: '#my-skeleton' },
          coach: { index: '02', label: 'Coach AI-Model', hash: '#coach-ai-model' },
          approval: { index: '03', label: 'Doctor Approval', hash: '#doctor-approval' },
          doctors: { index: '04', label: 'Doctors Review', hash: '#doctors-review' },
          contact: { index: '05', label: 'Contact Us', hash: '#contact-us' },
        };

        var ASTRONAUT_SPECIALTIES = [
          'Mission Commander',
          'Flight Engineer',
          'Payload Specialist',
        ];
        var DOCTOR_SPECIALTIES = ['Flight Surgeon', 'Orthopedic Specialist'];

        var DEFAULT_API_BASE =
          window.location.protocol === 'file:' ? 'http://127.0.0.1:5000' : '';

        function storageGet(key, fallback) {
          try {
            var val = window.localStorage.getItem(key);
            return val !== null ? val : fallback;
          } catch (e) {
            return fallback;
          }
        }

        function storageSet(key, val) {
          try {
            if (val === null || val === undefined) {
              window.localStorage.removeItem(key);
            } else {
              window.localStorage.setItem(key, val);
            }
          } catch (e) {}
        }

        function loadSavedUser() {
          try {
            var raw = window.localStorage.getItem('msd_session_user');
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        }

        var state = {
          route: getRouteFromHash(window.location.hash),
          selectedRole: null, // 'astronaut' | 'doctor' | null
          authMode: 'signin', // 'signin' | 'register'
          authLoading: false,
          authToken: storageGet('msd_auth_token', null),
          sessionUser: loadSavedUser(),
          apiBase: storageGet('msd_api_base', DEFAULT_API_BASE),
          errorMessage: null,
          coachSos: '1515.0',
          coachBua: '58.0',
          coachAstronautId: '',
          coachLoading: false,
          coachError: null,
          coachResult: null,
          coachHistory: [],
          scansLoadedForToken: null,
          doctorScans: [],
          doctorLoading: false,
          doctorError: null,
          doctorLoadedForToken: null,
          // 01 · My Skeleton 3D Workbench State
          skelViewMode: 'xray', // 'full' | 'xray' | 'exploded'
          skelPreset: 'full-body',
          skelDrawerTab: 'bones', // 'bones' | 'sensors'
          skelSelectedBone: 'femur-right',
          skelSelectedSensor: null,
          skelDockCollapsed: false,
          skelDatasetModalOpen: false,

        function getRouteFromHash(hash) {
          for (var key in MODULES) {
            if (MODULES[key].hash === hash) return key;
          }
          return 'orbit';
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function normalizeApiBase(rawUrl) {
          var clean = String(rawUrl || '').trim().replace(/\/+$/, '');
          if (clean.endsWith('/predict-colab')) {
            clean = clean.slice(0, -'/predict-colab'.length);
          } else if (clean.endsWith('/predict')) {
            clean = clean.slice(0, -'/predict'.length);
          }
          return clean;
        }

        function setApiBase(rawUrl) {
          var normalized = normalizeApiBase(rawUrl);
          state.apiBase = normalized;
          storageSet('msd_api_base', normalized);
          return normalized;
        }

        function setAuthSession(token, user) {
          state.authToken = token || null;
          state.sessionUser = user || null;
          storageSet('msd_auth_token', token || null);
          storageSet('msd_session_user', user ? JSON.stringify(user) : null);
          if (!token) {
            state.scansLoadedForToken = null;
            state.doctorLoadedForToken = null;
            state.coachHistory = [];
            state.doctorScans = [];
          }
        }

        function apiFetch(path, options) {
          var opts = options || {};
          var base = normalizeApiBase(state.apiBase);
          var url = base + path;
          var headers = {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true',
          };
          if (state.authToken) {
            headers['Authorization'] = 'Bearer ' + state.authToken;
          }

          return fetch(url, {
            method: opts.method || 'GET',
            headers: headers,
            body: opts.body ? JSON.stringify(opts.body) : undefined,
          })
            .catch(function () {
              var displayBase = base || window.location.origin;
              throw new Error(
                'Could not reach the backend server at "' +
                  displayBase +
                  '". Start backend/colab_server.py in Google Colab (and paste its base Ngrok URL) or run backend/app.py locally.'
              );
            })
            .then(function (res) {
              return res.text().then(function (text) {
                var parsed = null;
                try {
                  parsed = JSON.parse(text);
                } catch (e) {
                  throw new Error(
                    'Server returned a non-JSON response (HTTP ' +
                      res.status +
                      '). Verify your Backend URL points to the Flask server root.'
                  );
                }
                if (!res.ok) {
                  if (res.status === 401 && opts.clearOnUnauthorized) {
                    setAuthSession(null, null);
                  }
                  throw new Error(
                    (parsed && parsed.error) || 'Server returned HTTP ' + res.status
                  );
                }
                return parsed;
              });
            });
        }

        function syncHash(route) {
          var targetHash = route === 'orbit' ? '#orbit' : MODULES[route].hash;
          if (window.location.hash !== targetHash) {
            try {
              window.history.pushState(null, '', targetHash);
            } catch (e) {
              window.location.hash = targetHash;
            }
          }
        }

        function navigateTo(route) {
          state.route = route;
          state.errorMessage = null;
          syncHash(route);
          render();
        }

        window.addEventListener('hashchange', function () {
          state.route = getRouteFromHash(window.location.hash);
          render();
        });

        document.addEventListener('click', function (e) {
          var routeBtn = e.target.closest('[data-route]');
          if (routeBtn) {
            navigateTo(routeBtn.getAttribute('data-route'));
          }
        });

        // Verify saved JWT session on startup if one exists
        if (state.authToken) {
          apiFetch('/auth/me', { clearOnUnauthorized: true })
            .then(function (user) {
              setAuthSession(state.authToken, user);
              render();
            })
            .catch(function () {
              render();
            });

        function attachSignInHandlers() {

          if (btnAst) {
            btnAst.onclick = function () {
              state.selectedRole = 'astronaut';
              state.errorMessage = null;
              render();
            };
          }

          var btnDoc = document.getElementById('choose-doctor');
          if (btnDoc) {
            btnDoc.onclick = function () {
              state.selectedRole = 'doctor';
              state.errorMessage = null;
              render();
            };
          }

          var tabSignIn = document.getElementById('tab-signin');
          if (tabSignIn) {
            tabSignIn.onclick = function () {
              state.authMode = 'signin';
              state.errorMessage = null;
              render();
            };
          }

          var tabReg = document.getElementById('tab-register');
          if (tabReg) {
            tabReg.onclick = function () {
              state.authMode = 'register';
              state.errorMessage = null;
              render();
            };
          }

          var btnChangeRole = document.getElementById('btn-change-role');
          if (btnChangeRole) {
            btnChangeRole.onclick = function () {
              state.selectedRole = null;
              state.errorMessage = null;
              render();
            };
          }

          var authForm = document.getElementById('auth-form');
          if (authForm) {
            authForm.onsubmit = function (e) {
              e.preventDefault();
              var emailVal = (document.getElementById('inp-email').value || '').trim().toLowerCase();
              var passVal = document.getElementById('inp-password').value || '';
              var baseVal = (document.getElementById('inp-auth-base').value || '').trim();
              setApiBase(baseVal || DEFAULT_API_BASE);

              if (!emailVal || passVal.length < 8) {
                state.errorMessage =
                  'Enter a valid email address and a password of at least 8 characters.';
                render();
                return;
              }

              var path = state.authMode === 'register' ? '/auth/register' : '/auth/login';
              var payload = { email: emailVal, password: passVal };

              if (state.authMode === 'register') {
                var fullName = (document.getElementById('inp-name').value || '').trim();
                var badgeId = (document.getElementById('inp-badge').value || '').trim();
                if (!fullName) {
                  state.errorMessage = 'Full name is required to create an account.';
                  render();
                  return;
                }
                payload.full_name = fullName;
                payload.role = state.selectedRole;
                payload.badge_id = badgeId || null;
              }

              state.authLoading = true;
              state.errorMessage = null;
              render();

              apiFetch(path, { method: 'POST', body: payload })
                .then(function (data) {
                  state.authLoading = false;
                  setAuthSession(data.token, data.user);
                  render();
                })
                .catch(function (err) {
                  state.authLoading = false;
                  state.errorMessage = err.message || 'Authentication failed.';
                  render();
                });
            };
          }

          var btnSignOut = document.getElementById('btn-signout');
          if (btnSignOut) {
            btnSignOut.onclick = function () {
              setAuthSession(null, null);
              state.selectedRole = null;
              state.errorMessage = null;
              render();
            };
          }
        }

        function getPredictionStyle(label) {
          if (label === 'Normal') {
            return { cls: 'status-normal', glyph: '●' };
          }
          if (label === 'Osteopenia') {
            return { cls: 'status-osteopenia', glyph: '▲' };
          }
          return { cls: 'status-osteoporosis', glyph: '✖' };
        }

          if (!state.authToken) return;
          state.scansLoadedForToken = state.authToken;
          apiFetch('/scans/my', { clearOnUnauthorized: true })

              if (Array.isArray(rows)) {
                state.coachHistory = rows;
                render();

            .catch(function () {});

          state.doctorError = null;

          apiFetch('/scans/all', { clearOnUnauthorized: true })

              state.doctorScans = Array.isArray(rows) ? rows : [];
              render();

            .catch(function (err) {
              state.doctorLoading = false;
              state.doctorError = err.message || 'Could not load crew scans.';
              render();

        function getBoneCategory(pct) {
          if (pct === null || pct === undefined || isNaN(Number(pct))) {

              tScore: '—',

          }
          var v = Math.max(0, Math.min(100, Number(pct)));
          var sos = custom && custom.sos ? custom.sos : 1625 - v * 2.85;
          var bua = custom && custom.bua ? custom.bua : 86 - v * 0.74;
          var tScore = 0.6 - v * 0.056;

        function applyDatasetText(rawText) {
          var trimmed = String(rawText || '').trim();
          if (!trimmed) {
            state.skelWeakness = {};
            state.skelCustomMetrics = {};
            state.skelDatasetError = null;
            return true;
          }
          var validIds = {};
          BONE_CATALOG.forEach(function (b) {
            validIds[b.id] = true;
          });
          var nextWeakness = {};
          var nextMetrics = {};

          if (trimmed[0] === '[' || trimmed[0] === '{') {
            try {
              var parsed = JSON.parse(trimmed);
              var arr = Array.isArray(parsed) ? parsed : [parsed];
              arr.forEach(function (item) {
                var bid = item && (item.boneId || item.id);
                if (bid && validIds[bid]) {
                  var w = Number(item.weaknessPercent !== undefined ? item.weaknessPercent : item.weakness);
                  if (isFinite(w)) nextWeakness[bid] = Math.max(0, Math.min(100, Math.round(w)));
                  var s = Number(item.sosMs !== undefined ? item.sosMs : item.sos);
                  var bu = Number(item.buaDbMhz !== undefined ? item.buaDbMhz : item.bua);
                  if (isFinite(s) || isFinite(bu)) {
                    nextMetrics[bid] = { sos: isFinite(s) ? s : null, bua: isFinite(bu) ? bu : null };
                  }
                }
              });
            } catch (e) {
              state.skelDatasetError = 'Invalid JSON syntax. Use an array of { "boneId", "weaknessPercent" } objects or CSV rows.';
              return false;
            }
          } else {
            var lines = trimmed.split(/\r?\n/);
            var matchedAny = false;
            lines.forEach(function (line) {
              var clean = line.trim();
              if (!clean || clean.toLowerCase().indexOf('boneid') === 0) return;
              var parts = clean.split(',').map(function (p) { return p.trim(); });
              var bid = parts[0];
              if (bid && validIds[bid] && parts.length >= 2) {
                var w = Number(parts[1]);
                if (isFinite(w)) {
                  nextWeakness[bid] = Math.max(0, Math.min(100, Math.round(w)));
                  matchedAny = true;
                }
                var s = parts.length >= 3 ? Number(parts[2]) : NaN;
                var bu = parts.length >= 4 ? Number(parts[3]) : NaN;
                if (isFinite(s) || isFinite(bu)) {
                  nextMetrics[bid] = { sos: isFinite(s) ? s : null, bua: isFinite(bu) ? bu : null };
                }
              }
            });
            if (!matchedAny) {
              state.skelDatasetError = 'No valid CSV rows matched. Expected format: femur-right,55,1468,44';
              return false;
            }
          }

          state.skelWeakness = nextWeakness;
          state.skelCustomMetrics = nextMetrics;
          state.skelDatasetError = null;
          return true;
        }

        function ensureThreeLoaded() {
          if (window.THREE && window.ThreeOrbitControls && window.ThreeRoomEnvironment) {

          threePromise = new Promise(function (resolve, reject) {
            var script = document.createElement('script');
            script.src = vendorBase + '/three-bundle.js';
            script.onload = function () {
              if (window.THREE) resolve();
              else reject(new Error('Three.js bundle failed to expose THREE global.'));
            };
            script.onerror = function () {
              reject(new Error('Could not load ' + script.src));
            };
            document.head.appendChild(script);
          });
          return threePromise;

        function createPedestalTexture(THREE, maxAniso) {
          var canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          var ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, 512, 512);
          ctx.translate(256, 256);

          var grad = ctx.createRadialGradient(0, 0, 20, 0, 0, 246);
          grad.addColorStop(0, 'rgba(34, 211, 238, 0.14)');
          grad.addColorStop(0.68, 'rgba(15, 23, 42, 0.35)');
          grad.addColorStop(0.92, 'rgba(34, 211, 238, 0.38)');
          grad.addColorStop(1, 'rgba(34, 211, 238, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, 246, 0, Math.PI * 2);
          ctx.fill();

          [125, 180, 224].forEach(function (r, idx) {
            ctx.strokeStyle = idx === 2 ? 'rgba(103, 232, 249, 0.92)' : 'rgba(34, 211, 238, 0.42)';

            ctx.lineWidth = i % 3 === 0 ? 2.5 : 1.2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
            ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
            ctx.stroke();
          }

          var tex = new THREE.CanvasTexture(canvas);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = maxAniso || 1;

        function mountSkeletonScene(mountEl, tooltipEl) {

          BONE_CATALOG.forEach(function (b) {

          var scanProgress = 0;

            BONE_CATALOG.forEach(function (b) {

              var cat = getBoneCategory(state.skelWeakness[b.id]);

                mat.emissiveIntensity = 0.25;
              } else {
                mat.emissive.setHex(0x000000);
                mat.emissiveIntensity = 0;
              }
            });

            var isFull = state.skelViewMode === 'full';

            active: false,

            var p = CAMERA_PRESETS[key];

            camAnim.pos.set(p.pos[0], p.pos[1], p.pos[2]);
            camAnim.target.set(p.target[0], p.target[1], p.target[2]);
            camAnim.active = true;
            requestRender();

          controls.addEventListener('start', function () {

            requestRender();
          });
          controls.addEventListener('change', function () {
            requestRender();
          });

          // Raycasting for Bone/Sensor Hover & Selection
          var raycaster = new THREE.Raycaster();
          var pointer = new THREE.Vector2();
          var lastMoveTime = 0;
          var pointerDownPos = { x: 0, y: 0 };

          function updatePointer(ev) {
            var rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
          }

          function onPointerDown(ev) {
            pointerDownPos.x = ev.clientX;
            pointerDownPos.y = ev.clientY;
          }

          function onPointerMove(ev) {
            var now = Date.now();
            if (now - lastMoveTime < 35) return;
            lastMoveTime = now;
            updatePointer(ev);
            raycaster.setFromCamera(pointer, camera);
            var targets = boneMeshes.concat(sensorMeshes);
            var hits = raycaster.intersectObjects(targets, false);
            if (hits.length > 0 && hits[0].object.userData.boneId) {
              var bid = hits[0].object.userData.boneId;
              var sid = hits[0].object.userData.sensorId;
              var boneMeta = BONE_CATALOG.find(function (b) { return b.id === bid; });
              var w = state.skelWeakness[bid];
              var text = (sid ? sid + ' · ' : '') + (boneMeta ? boneMeta.label : bid) + (w !== undefined && w !== null ? ' · ' + w + '%' : ' · Unassessed');
              renderer.domElement.style.cursor = 'pointer';
              if (tooltipEl) {
                var rect = mountEl.getBoundingClientRect();
                tooltipEl.textContent = text;
                tooltipEl.style.left = Math.min(rect.width - 180, Math.max(10, ev.clientX - rect.left + 12)) + 'px';
                tooltipEl.style.top = Math.max(10, ev.clientY - rect.top - 28) + 'px';
                tooltipEl.hidden = false;
              }
            } else {
              renderer.domElement.style.cursor = 'grab';
              if (tooltipEl) tooltipEl.hidden = true;
            }
          }

          function onPointerUp(ev) {
            var dx = ev.clientX - pointerDownPos.x;
            var dy = ev.clientY - pointerDownPos.y;
            if (dx * dx + dy * dy > 25) return; // Ignore orbit drags
            updatePointer(ev);
            raycaster.setFromCamera(pointer, camera);
            var hits = raycaster.intersectObjects(boneMeshes.concat(sensorMeshes), false);
            if (hits.length > 0 && hits[0].object.userData.boneId) {
              state.skelSelectedBone = hits[0].object.userData.boneId;
              if (hits[0].object.userData.sensorId) {
                state.skelSelectedSensor = hits[0].object.userData.sensorId;
              }
              syncVisuals();
              renderSkeletonDrawer();
            }
          }

          renderer.domElement.addEventListener('pointerdown', onPointerDown);
          renderer.domElement.addEventListener('pointermove', onPointerMove);
          renderer.domElement.addEventListener('pointerup', onPointerUp);

          function onResize() {
            if (!mountEl || mountEl.clientWidth === 0) return;
            var w = mountEl.clientWidth;
            var h = mountEl.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            requestRender();
          }
          window.addEventListener('resize', onResize);

          // Pre-warm shaders once on hardware GPUs
          if (!isSoftwareGl) {
            renderer.compile(scene, camera);
          }

          // Render-on-Demand & Damped Animation Loop
          var frameId = 0;
          var renderBusy = false;
          var renderDirty = false;
          var prevTime = performance.now();
          var disposed = false;

          function afterDraw(cb) {
            var gl = renderer.getContext();
            var sync = gl && gl.fenceSync ? gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0) : null;
            if (!sync) {
              frameId = window.setTimeout(cb, 80);
              return;
            }
            gl.flush();
            function poll() {
              if (disposed) return;
              var st = gl.getSyncParameter(sync, gl.SYNC_STATUS);
              if (st === gl.UNSIGNALED) {
                frameId = window.setTimeout(poll, 5);
              } else {
                gl.deleteSync(sync);
                frameId = window.setTimeout(cb, 80);
              }
            }
            frameId = window.setTimeout(poll, 5);
          }

          function requestRender() {
            if (disposed) return;
            if (renderBusy) {
              renderDirty = true;
              return;
            }
            renderBusy = true;
            frameId = window.requestAnimationFrame(function (now) {
              if (disposed) return;
              renderDirty = false;
              var dt = Math.min(0.05, Math.max(0.001, (now - prevTime) / 1000));
              prevTime = now;

              var needsMore = false;
              var explodeFactor = state.skelViewMode === 'exploded' ? 1 : 0;

              suitPanels.forEach(function (sp) {
                var tx = sp.base[0] + sp.explode[0] * explodeFactor;
                var ty = sp.base[1] + sp.explode[1] * explodeFactor;
                var tz = sp.base[2] + sp.explode[2] * explodeFactor;
                if (
                  Math.abs(sp.mesh.position.x - tx) > 0.002 ||
                  Math.abs(sp.mesh.position.y - ty) > 0.002 ||
                  Math.abs(sp.mesh.position.z - tz) > 0.002
                ) {
                  sp.mesh.position.x = THREE.MathUtils.damp(sp.mesh.position.x, tx, 7.5, dt);
                  sp.mesh.position.y = THREE.MathUtils.damp(sp.mesh.position.y, ty, 7.5, dt);
                  sp.mesh.position.z = THREE.MathUtils.damp(sp.mesh.position.z, tz, 7.5, dt);
                  needsMore = true;
                }
              });

              if (camAnim.active) {
                camera.position.x = THREE.MathUtils.damp(camera.position.x, camAnim.pos.x, 7, dt);
                camera.position.y = THREE.MathUtils.damp(camera.position.y, camAnim.pos.y, 7, dt);
                camera.position.z = THREE.MathUtils.damp(camera.position.z, camAnim.pos.z, 7, dt);
                controls.target.x = THREE.MathUtils.damp(controls.target.x, camAnim.target.x, 7, dt);
                controls.target.y = THREE.MathUtils.damp(controls.target.y, camAnim.target.y, 7, dt);
                controls.target.z = THREE.MathUtils.damp(controls.target.z, camAnim.target.z, 7, dt);
                if (camera.position.distanceTo(camAnim.pos) < 0.015) {
                  camAnim.active = false;
                } else {
                  needsMore = true;
                }
              }

              if (scanActive) {
                scanProgress += dt * 0.48;
                if (scanProgress >= 1) {
                  scanActive = false;
                  scanRing.visible = false;
                  scanRingMat.opacity = 0;
                } else {
                  var wave = Math.sin(scanProgress * Math.PI);
                  scanRing.visible = true;
                  scanRing.position.y = 0.14 + wave * 1.76;
                  scanRingMat.opacity = 0.85 * Math.sin(scanProgress * Math.PI);
                  needsMore = true;
                }
              }

              if (controls.update() || needsMore) {
                renderDirty = true;
              }

              renderer.render(scene, camera);

              function done() {
                renderBusy = false;
                if (renderDirty && !disposed) requestRender();
              }
              if (isSoftwareGl) afterDraw(done);
              else done();
            });
          }

          syncVisuals();

          skelController = {
            syncVisuals: syncVisuals,
            setPreset: setPreset,
            triggerScan: function () {
              scanActive = true;
              scanProgress = 0;
              requestRender();
            },
            dispose: function () {
              disposed = true;
              window.cancelAnimationFrame(frameId);
              window.clearTimeout(frameId);
              window.removeEventListener('resize', onResize);
              renderer.domElement.removeEventListener('pointerdown', onPointerDown);
              renderer.domElement.removeEventListener('pointermove', onPointerMove);
              renderer.domElement.removeEventListener('pointerup', onPointerUp);
              controls.dispose();
              disposables.geometries.forEach(function (g) { g.dispose(); });
              disposables.materials.forEach(function (m) { m.dispose(); });
              disposables.textures.forEach(function (t) { t.dispose(); });
              envRT.dispose();
              renderer.dispose();
            },
          };
        }

          var assessedCount = 18 - counts.empty;

                '<span style="color:#F59E0B;">Moderate (18–37%) (' + counts.moderate + ')</span> · ' +
                '<span style="color:#EF4444;">Critical (&ge;38%) (' + counts.critical + ')</span>' +

            ? '<button type="button" id="hud-sync-coach" class="skel-btn">Apply Coach Scan</button>'

        function syncCoachResultToSkeleton() {
          if (!state.coachResult) return;
          var tScore = Number(state.coachResult.t_score);
          var estWeak = isFinite(tScore) ? Math.round(Math.max(4, Math.min(92, (-tScore + 0.6) / 0.056))) : 36;
          state.skelWeakness['calcaneus-right'] = estWeak;
          state.skelWeakness['femur-right'] = Math.min(100, estWeak + 4);
          state.skelCustomMetrics['calcaneus-right'] = {
            sos: Number(state.coachResult.sos) || null,
            bua: Number(state.coachResult.bua) || null,
          };
          state.skelSelectedBone = 'calcaneus-right';
          if (skelController) skelController.syncVisuals();
          renderSkeletonDrawer();
        }

              });

            };

          document.querySelectorAll('[data-cam-preset]').forEach(function (btn) {
            btn.onclick = function () {
              var key = btn.getAttribute('data-cam-preset');
              state.skelPreset = key;
              document.querySelectorAll('[data-cam-preset]').forEach(function (b) {
                b.classList.toggle('is-active', b === btn);
              });
              if (skelController) skelController.setPreset(key);
            };
          });

          if (tabBones) {
            tabBones.onclick = function () {
              state.skelDrawerTab = 'bones';

          }
          var tabSensors = document.getElementById('skel-tab-sensors');

            tabSensors.onclick = function () {
              state.skelDrawerTab = 'sensors';
              renderSkeletonDrawer();
            };
          }

            drawerBody.addEventListener('click', function (e) {
              if (e.target.matches('[data-bone-input]')) return;
              if (e.target.id === 'skel-sel-clear') {
                delete state.skelWeakness[state.skelSelectedBone];
                if (skelController) skelController.syncVisuals();
                renderSkeletonDrawer();

              var boneRow = e.target.closest('[data-bone-pick]');
              if (boneRow) {
                state.skelSelectedBone = boneRow.getAttribute('data-bone-pick');

              if (e.target.id === 'skel-sel-slider') {

              textarea.value = SAMPLE_DATASET_TEXT;
              state.skelDatasetDraft = SAMPLE_DATASET_TEXT;
            };
          }

          var btnModalClear = document.getElementById('skel-modal-clear');
          if (btnModalClear && textarea) {
            btnModalClear.onclick = function () {
              textarea.value = '';
              state.skelDatasetDraft = '';
            };
          }

          var fileInp = document.getElementById('skel-file-upload');
          if (fileInp && textarea) {
            fileInp.onchange = function (ev) {
              var file = ev.target.files && ev.target.files[0];
              if (!file) return;
              var reader = new FileReader();
              reader.onload = function () {
                textarea.value = String(reader.result || '');
                state.skelDatasetDraft = textarea.value;
              };
              reader.readAsText(file);
            };
          }

          var btnApply = document.getElementById('skel-modal-apply');
          if (btnApply && textarea) {
            btnApply.onclick = function () {
              state.skelDatasetDraft = textarea.value;
              var ok = applyDatasetText(textarea.value);
              if (!ok) {
                if (errBox) {
                  errBox.textContent = state.skelDatasetError;
                  errBox.hidden = false;
                }
                return;
              }
              closeDatasetModal();
              if (skelController) skelController.syncVisuals();
              renderSkeletonDrawer();
            };
          }
        }

        function renderContactContent() {
          return (
            '<div class="glass-panel pop-animate">' +
              '<h1 class="panel-title">Contact Us</h1>' +
              '<p class="panel-subtitle">Direct medical telemetry desk &amp; mission support for Mascu-Skeletal Diagnosis.</p>' +
              '<div class="panel-divider form-stack">' +
                '<div class="contact-item">' +
                  '<div style="min-width:0;">' +
                    '<p class="metric-label">Support Email</p>' +
                    '<a class="contact-link" href="mailto:support@mascuskeletal-med.org">support@mascuskeletal-med.org</a>' +
                  '</div>' +
                  '<button type="button" class="btn-secondary" data-copy="support@mascuskeletal-med.org">Copy</button>' +
                '</div>' +
                '<div class="contact-item">' +
                  '<div style="min-width:0;">' +
                    '<p class="metric-label">Mission Phone Number</p>' +
                    '<a class="contact-link" href="tel:+12815550194">+1 (281) 555-0194</a>' +
                  '</div>' +
                  '<button type="button" class="btn-secondary" data-copy="+1 (281) 555-0194">Copy</button>' +
                '</div>' +
              '</div>' +
              '<div class="panel-divider actions-group">' +
                '<button type="button" class="btn-primary" data-route="orbit">' +
                  '<svg class="icon text-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path>' +
                  '</svg>' +
                  'Back to orbit' +
                '</button>' +
              '</div>' +
            '</div>'
          );
        }

        function attachContactHandlers() {
          document.querySelectorAll('[data-copy]').forEach(function (btn) {
            btn.onclick = function () {
              var val = btn.getAttribute('data-copy');
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(val).catch(function () {});
              }
              btn.textContent = 'Copied';
              window.setTimeout(function () {
                btn.textContent = 'Copy';
              }, 1600);
            };
          });
        }

        function render() {
          var isOrbit = state.route === 'orbit';
          var isContact = state.route === 'contact';
          if (state.route !== 'skeletons') {
            disposeSkeletonScene();
          }

          viewOrbit.hidden = !isOrbit;
          viewModule.hidden = isOrbit;
          pageScrim.classList.toggle('is-active', !isOrbit && !isContact);
          contactAstronautAnchor.hidden = !isContact;
          moduleBody.classList.toggle('is-wide', state.route === 'coach' || state.route === 'doctors' || state.route === 'approval');
          moduleBody.classList.toggle('is-contact', isContact);
          moduleBody.classList.toggle('is-skeleton', state.route === 'skeletons');

          if (!isOrbit) {
            if (state.route === 'signin') {
              moduleBody.innerHTML = renderSignInContent();
              attachSignInHandlers();
            } else if (state.route === 'skeletons') {
              moduleBody.innerHTML = renderSkeletonsContent();
              attachSkeletonHandlers();
            } else if (state.route === 'coach') {
              moduleBody.innerHTML = renderCoachContent();
              attachCoachHandlers();
            } else if (state.route === 'approval') {
              moduleBody.innerHTML = renderApprovalContent();
            } else if (state.route === 'doctors') {
              moduleBody.innerHTML = renderDoctorsContent();
              attachDoctorsHandlers();
            } else if (state.route === 'contact') {
              moduleBody.innerHTML = renderContactContent();
              attachContactHandlers();
            }
          }
        }

        render();
      })();
    </script>
  </body>
</html>
